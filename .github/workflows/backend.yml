# CI del backend: compila, corre los tests (Testcontainers con PostgreSQL real) y verifica que la
# imagen Docker que despliega Render se construye. Corre en cada push y PR que toque el backend.
name: Backend

on:
  push:
    branches: [develop, main, "feature/**", "fix/**", "release/**", "hotfix/**", "docs/**"]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la corrida anterior (ahorra minutos de Actions)
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    name: Compilar y testear
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testcontainers usa el Docker que ya trae el runner de GitHub
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

      - name: Reportes de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  docker:
    name: Imagen Docker (Render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t aguaya-backend:ci .
