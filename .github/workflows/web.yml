# CI del panel web: tipos, tests y build de producción (lo mismo que construye Vercel).
name: Web

on:
  push:
    branches: [develop, main, "feature/**", "fix/**", "release/**", "hotfix/**"]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [develop, main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  build:
    name: Tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
