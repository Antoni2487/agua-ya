# Blueprint de Render: backend Spring Boot (Docker) + PostgreSQL 16.
# En Render: New > Blueprint > este repositorio. Despliega la rama develop (docs/especificacion.md, sección 15).
# Las variables con "sync: false" se completan en el panel de Render; nunca se commitean.

databases:
  - name: aguaya-db
    databaseName: aguaya
    user: aguaya
    plan: free
    region: virginia
    postgresMajorVersion: "16"

services:
  - type: web
    name: aguaya-backend
    runtime: docker
    plan: free
    region: virginia
    branch: develop
    autoDeploy: true
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # La instancia free tiene 512 MB: la JVM usa como máximo el 75 %
      # Swagger encendido para las demos; poner "false" si la URL se comparte fuera del equipo
      - key: SWAGGER_ENABLED
        value: "true"
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC

      # Base de datos (conexión interna de Render, misma región)
      - key: DB_HOST
        fromDatabase:
          name: aguaya-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: aguaya-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: aguaya-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: aguaya-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: aguaya-db
          property: password

      # Auth: Render genera un secreto aleatorio en el primer despliegue
      - key: JWT_SECRET
        generateValue: true

      # Orígenes del panel web y del panel público, separados por coma (actualizar al desplegar el web)
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://agua-ya-web.vercel.app,https://agua-ya-rediseno-epsel.vercel.app

      # OTP: "log" deja el código solo en los logs de Render (demo). Con las credenciales, cambiar a "twilio".
      - key: OTP_PROVIDER
        value: log
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SID
        sync: false

      # Nombres del vecino a partir del DNI (miapi.cloud); el token se carga en el panel de Render
      - key: DNI_PROVIDER
        value: miapi
      - key: DNI_API_TOKEN
        sync: false

      # Web Push: sin cliente web por ahora (el vecino usa la app). Para activarlo: "vapid" + las claves VAPID en el panel
      - key: WEB_PUSH_PROVIDER
        value: log
      - key: WEB_PUSH_CLAVE_PUBLICA
        sync: false
      - key: WEB_PUSH_CLAVE_PRIVADA
        sync: false
      - key: WEB_PUSH_SUJETO
        sync: false

      # Push a la app (Expo)
      - key: PUSH_PROVIDER
        value: expo
      - key: EXPO_ACCESS_TOKEN
        sync: false
