# Solo tests: cuenta las sentencias SQL por petición (ConsultasPorPeticionTest) sin llenar el log.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN
# Sin caché: cada test ve los datos que acaba de crear (CacheTransparenciaTest lo activa)
spring.cache.type=none
