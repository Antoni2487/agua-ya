# En prod las credenciales llegan solo por variables de entorno (sin valores por defecto).
spring:
  datasource:
    # DB_URL completa, o sus partes (Render entrega host, puerto y base por separado)
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

aguaya:
  cors:
    origins: ${CORS_ORIGINS}
  push:
    provider: ${PUSH_PROVIDER:expo}

logging:
  level:
    pe.epsel.aguaya: INFO
