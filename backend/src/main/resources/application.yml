spring:
  application:
    name: aguaya
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aguaya}
    username: ${DB_USER:aguaya}
    password: ${DB_PASSWORD:aguaya}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

aguaya:
  zona-horaria: America/Lima
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  geocerca:
    radio-metros: ${GEOCERCA_RADIO_METROS:50}
