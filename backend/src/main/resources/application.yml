spring:
  application:
    name: aguaya
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aguaya}
    username: ${DB_USER:aguaya}
    password: ${DB_PASSWORD:aguaya}
    hikari:
      # Render free admite pocas conexiones; ajustar con DB_POOL_MAX al subir de plan
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_updates: true
        # Las relaciones lazy que se recorran se cargan de a 50 con IN (...), no una consulta por fila (N+1)
        default_batch_fetch_size: 50
        query:
          # Falla en vez de paginar en memoria si se combina JOIN FETCH de colecciones con paginación
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        # Payloads pequeños para celulares de gama baja (RNF04)
        default-page-size: 20
        max-page-size: 100
  cache:
    type: caffeine
    cache-names: transparencia-resumen,transparencia-sectores,transparencia-cronograma
    # Datos agregados del panel público: un desfase de minutos es aceptable (CACHE_SEGUNDOS)
    caffeine:
      spec: maximumSize=500,expireAfterWrite=${CACHE_SEGUNDOS:120}s
  jackson:
    time-zone: America/Lima
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  # Respuestas JSON comprimidas: menos datos para celulares de gama baja (RNF04)
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1024
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  # SWAGGER_ENABLED=false apaga Swagger UI y /v3/api-docs (p. ej. si la URL de prod se hace pública)
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}

aguaya:
  zona-horaria: America/Lima
  cors:
    origins: ${CORS_ORIGINS:http://localhost:5173}
  geocerca:
    radio-metros: ${GEOCERCA_RADIO_METROS:50}
    vigencia-posicion-segundos: ${GEOCERCA_VIGENCIA_POSICION_SEGUNDOS:120}
  jwt:
    secret: ${JWT_SECRET}
    access-minutos: ${JWT_ACCESS_MINUTOS:15}
    refresh-dias: ${JWT_REFRESH_DIAS:30}
  otp:
    provider: ${OTP_PROVIDER:log}
    exponer-codigo: false
    vigencia-minutos: 5
    max-intentos: 3
    max-envios-hora: 3
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    verify-sid: ${TWILIO_VERIFY_SID:}
  push:
    provider: ${PUSH_PROVIDER:log}
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
    radio-cercania-metros: ${PUSH_RADIO_CERCANIA_METROS:500}
