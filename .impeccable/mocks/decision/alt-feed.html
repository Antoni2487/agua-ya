<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Vertical</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Atkinson Hyperlegible',sans-serif;background:linear-gradient(170deg,#5CC6F2,#0A5BB5 55%,#0E2A5C);color:#fff;position:relative}
.top{padding:20px;font-weight:700;font-size:20px}
.rail{position:absolute;right:14px;bottom:170px;display:grid;gap:22px;text-align:center;font-size:13px}
.rail i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);font-style:normal;font-size:22px;margin:0 auto 4px}
.cap{position:absolute;left:20px;right:90px;bottom:60px}
.cap small{font-size:16px;opacity:.9}
.cap h1{font-size:44px;line-height:1;margin:8px 0}
.cap p{font-size:18px}
</style></head><body>
<div class="top">AguaYa</div>
<div class="rail"><div><i>🗺</i>Mapa</div><div><i>⚠</i>Reportar</div><div><i>★</i>Calificar</div><div><i>👤</i>Cuenta</div></div>
<div class="cap"><small>Hoy · turno mañana · Cerropón</small><h1>Faltan 3 paradas</h1><p>La cisterna AYA-101 va por la parada 9. La tuya es la 13.</p></div>
</body></html>
