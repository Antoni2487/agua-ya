<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Señalética</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Hanken Grotesk',sans-serif;background:#1A1A1A;color:#fff}
header{height:56px;display:flex;align-items:center;padding:0 16px;font-weight:800;font-size:22px}
.panel{background:#FFD200;color:#111;margin:0 12px;padding:20px 18px;border-radius:2px}
.panel small{font-size:16px;font-weight:800}
.big{display:flex;align-items:center;gap:16px;margin-top:8px}
.big b{font-size:150px;line-height:.9;font-weight:800;letter-spacing:-6px}
.big span{font-size:26px;font-weight:800;line-height:1.1}
.pict{display:flex;gap:10px;margin-top:16px;align-items:center;font-size:18px;font-weight:500}
.pict i{width:44px;height:44px;background:#111;color:#fff;display:grid;place-items:center;font-style:normal;font-size:22px}
.band{margin:12px;background:#111;border:2px solid #FFD200;color:#FFD200;padding:16px;font-size:20px;font-weight:800;display:flex;justify-content:space-between}
.info{margin:0 12px;color:#ddd;font-size:16px;line-height:1.5}
</style></head><body>
<header>AguaYa</header>
<div class="panel"><small>HOY · TURNO MAÑANA · CERROPÓN</small>
<div class="big"><b>3</b><span>paradas<br>antes de<br>la tuya</span></div>
<div class="pict"><i>🚚</i>Cisterna AYA-101 en la parada 9 de 24</div></div>
<div class="band"><span>Ver en el mapa</span><span>→</span></div>
<div class="band" style="border-color:#555;color:#fff"><span>Reportar un problema</span><span>→</span></div>
<p class="info">Tu parada: 13 · Mz. B Lt. 12<br>Última entrega: lun 2 nov</p>
</body></html>
