<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Pase</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Atkinson Hyperlegible',sans-serif;background:#E8EEF5;color:#0E2A5C}
header{height:60px;display:flex;align-items:center;padding:0 16px;font-weight:700;font-size:21px;background:#fff}
.pass{margin:16px;background:#fff;border-radius:14px;overflow:hidden}
.top{background:#0E2A5C;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;padding:14px 16px;gap:8px}
.seg small{display:block;font-size:13px;color:#4A5874;letter-spacing:1px}
.seg b{font-size:22px;font-variant-numeric:tabular-nums}
.est{border-top:2px dashed #C3CEDC;padding:14px 16px;font-size:20px;font-weight:700}
.est span{color:#D97706}
table{width:calc(100% - 32px);margin:0 16px;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
td{padding:11px 12px;border-bottom:1px solid #E8EEF5}
.y td{background:#FFF4E5;font-weight:700}
</style></head><body>
<header>AguaYa</header>
<div class="pass"><div class="top"><span>CERROPÓN</span><span>HOY 4 NOV</span></div>
<div class="seg"><div><small>TURNO</small><b>Mañana</b></div><div><small>PARADA</small><b>13</b></div><div><small>CISTERNA</small><b>AYA-101</b></div></div>
<div class="est">Faltan 3 paradas · <span>en camino</span></div></div>
<table><tr><td>09</td><td>Mz. C Lt. 9</td><td>Aquí ahora</td></tr><tr><td>10</td><td>Mz. D Lt. 2</td><td>Pendiente</td></tr><tr><td>11</td><td>Posta</td><td>Pendiente</td></tr><tr><td>12</td><td>Mz. D Lt. 7</td><td>Pendiente</td></tr><tr class="y"><td>13</td><td>Tu casa</td><td>Tu parada</td></tr></table>
</body></html>
