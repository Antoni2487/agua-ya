<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Ticket de turno</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
:root{--marino:#0E2A5C;--noche:#0B1E40;--agua:#1B8FD2;--claro:#5CC6F2;--tinta:#14213D;--suave:#4A5874}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Atkinson Hyperlegible',sans-serif;background:#EEF2F7;color:var(--tinta);position:relative}
header{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #D5DDE8}
.marca{font-weight:700;font-size:21px;color:var(--marino)}.marca b{color:var(--agua)}
main{padding:14px 16px}
.pantalla{background:var(--noche);border-radius:12px;padding:16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.pantalla small{display:block;font-size:14px;letter-spacing:2px;color:#AFC0D8;font-weight:700}
.pantalla .led{font-family:'Bricolage Grotesque';font-size:78px;line-height:.9;color:var(--claro);text-shadow:0 0 18px rgba(92,198,242,.45)}
.pantalla p{font-size:15px;color:#D7E1EE;text-align:right;line-height:1.4}
.ticket{position:relative;margin:14px 10px 0;background:#fff;border-radius:6px 6px 0 0;padding:18px 18px 26px;box-shadow:0 2px 10px rgba(14,42,92,.12)}
.ticket::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:radial-gradient(circle at 8px 0,#fff 8px,transparent 8.5px) 0 0/16px 10px}
.ticket small{font-size:14px;letter-spacing:2px;font-weight:700;color:var(--suave)}
.num{font-family:'Bricolage Grotesque';font-size:120px;line-height:.9;color:var(--marino);margin-top:4px}
.faltan{font-size:22px;font-weight:700;color:var(--marino)}
.faltan b{color:var(--agua)}
dl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:2px dashed #C3CEDC}
dt{font-size:14px;color:var(--suave)}dd{font-size:17px;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.btn{height:54px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.prim{background:var(--marino);color:#fff}.sec{border:2px solid var(--marino);color:var(--marino);background:#fff}
footer{position:absolute;bottom:10px;left:16px;font-size:14px;color:var(--suave)}
</style></head><body>
<header><span class="marca">Agua<b>Ya</b></span><span>☰</span></header>
<main>
<div class="pantalla"><div><small>ATENDIENDO</small><span class="led">09</span></div><p>Cerropón<br>Hoy · turno mañana<br>● En camino</p></div>
<div class="ticket"><small>SU NÚMERO</small><p class="num">13</p><p class="faltan">Faltan <b>3 paradas</b> antes de usted</p>
<dl><div><dt>Cisterna</dt><dd>AYA-101</dd></div><div><dt>Capacidad</dt><dd>12 000 L</dd></div><div><dt>Dirección</dt><dd>Mz. B Lt. 12</dd></div><div><dt>Última entrega</dt><dd>lun 2 nov</dd></div></dl></div>
<div class="btns"><a class="btn prim">Ver en el mapa</a><a class="btn sec">Reportar</a></div>
</main>
<footer>Servicio de EPSEL S.A. · Datos referenciales</footer>
</body></html>
