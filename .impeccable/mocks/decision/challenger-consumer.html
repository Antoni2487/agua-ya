<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Consumo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:Nunito,sans-serif;background:#F4F1EC;color:#1D2733}
.top{padding:22px 20px 8px}.top small{color:#5B6B7C;font-size:15px}.top h1{font-size:26px}
.card{background:#fff;margin:12px 16px;border-radius:24px;padding:20px}
.card small{color:#5B6B7C;font-size:15px}
.card h2{font-size:30px;margin:6px 0}
.bar{height:12px;background:#E7EEF6;border-radius:9px;margin-top:12px}.bar i{display:block;height:12px;width:38%;background:#0A5BB5;border-radius:9px}
.map{height:200px;background:#DDE7EE;border-radius:24px;margin:0 16px;display:grid;place-items:center;color:#5B6B7C}
.btn{margin:14px 16px;height:56px;border-radius:28px;background:#0A5BB5;color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
nav{position:absolute;bottom:0;width:390px;height:72px;background:#fff;display:flex;justify-content:space-around;align-items:center;font-size:13px;color:#5B6B7C}
nav b{color:#0A5BB5}
</style></head><body>
<div class="top"><small>Cerropón · Chiclayo</small><h1>Hola, Carmen 👋</h1></div>
<div class="card"><small>Hoy, turno mañana</small><h2>Tu agua está en camino</h2><p>Faltan 3 paradas antes de la tuya</p><div class="bar"><i></i></div></div>
<div class="map">Mapa · cisterna AYA-101</div>
<div class="btn">Ver la cisterna</div>
<nav><b>Inicio</b><span>Mapa</span><span>Reportar</span><span>Mi cuenta</span></nav>
</body></html>
