<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Canon</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:system-ui,sans-serif;background:#fff;color:#111827}
.map{height:470px;background:#E5EAF0;position:relative}
.map i{position:absolute;left:180px;top:200px;width:36px;height:36px;border-radius:50%;background:#2563EB;border:4px solid #fff}
.sheet{position:absolute;top:440px;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:20px;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.sheet h1{font-size:24px}.sheet p{color:#4B5563;margin-top:6px}
.prog{height:8px;background:#E5E7EB;border-radius:4px;margin:18px 0}.prog i{display:block;height:8px;width:38%;background:#2563EB;border-radius:4px}
.row{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid #E5E7EB}
.btn{height:52px;background:#2563EB;color:#fff;border-radius:12px;display:grid;place-items:center;font-weight:600;margin-top:12px}
</style></head><body>
<div class="map"><i></i></div>
<div class="sheet"><h1>Tu agua está en camino</h1><p>Faltan 3 paradas antes de la tuya</p><div class="prog"><i></i></div>
<div class="row"><span>Cisterna</span><b>AYA-101</b></div><div class="row"><span>Turno</span><b>Mañana</b></div>
<div class="btn">Reportar un problema</div></div>
</body></html>
